name: CI

on:
  push:
    branches: [main, layers]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # Debug catches safety faults; ReleaseSafe checks optimized code and timing on each host.
  # The fixtures expect the same answers in every mode; filtering just repeats a subset.
  # The full test target already builds and runs the examples.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        optimize: [Debug, ReleaseSafe]
        include:
          # One unchecked run catches optimizer-dependent behaviour; the other hosts have ReleaseSafe.
          - os: ubuntu-latest
            optimize: ReleaseFast
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Test — ${{ matrix.optimize }}
        run: zig build test -Doptimize=${{ matrix.optimize }}

  # ReleaseSmall must build; its unchecked tests add no distinct assertion to ReleaseFast.
  small:
    name: compile (ReleaseSmall)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build -Doptimize=ReleaseSmall

  # Formatting and source-policy checks read the same files on every host; once is enough.
  source:
    name: source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Formatting
        run: zig fmt --check build.zig build.zig.zon src examples ci
      - name: Casts out of the type system carry their reason
        run: python3 ci/casts.py
      - name: Source import boundaries
        run: zig build check-imports
      - name: Import gate regression checks
        run: python3 ci/test_imports.py

  # Compile the supported targets the native jobs cannot execute.
  cross-compile:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - x86_64-windows-gnu
          - x86_64-windows-msvc
          - aarch64-windows-gnu
          - x86_64-macos
          - aarch64-macos
          - x86_64-freebsd
          - x86_64-netbsd
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build -Dtarget=${{ matrix.target }}

  # The report goldens the suite compares against must read in the tools they are for.
  reports:
    name: report formats
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Graphviz lays out the DOT goldens
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q graphviz
          for f in src/golden/*.dot; do dot -Tsvg "$f" -o /dev/null || exit 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mermaid renders the flowchart goldens
        run: |
          echo '{"args": ["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          for f in src/golden/*.mmd; do
            npx -y -p @mermaid-js/mermaid-cli@11 mmdc -q -p "$RUNNER_TEMP/puppeteer.json" -i "$f" -o "$RUNNER_TEMP/out.svg" || exit 1
          done
      - name: JSON goldens parse and SARIF goldens match the SARIF 2.1.0 schema
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q jsonschema
          curl -fsSL https://json.schemastore.org/sarif-2.1.0.json -o "$RUNNER_TEMP/sarif-schema.json"
          "$RUNNER_TEMP/venv/bin/python" - "$RUNNER_TEMP/sarif-schema.json" src/golden/*.json src/golden/*.sarif <<'PY'
          import json, sys, jsonschema
          schema = json.load(open(sys.argv[1], encoding="utf-8"))
          for name in sys.argv[2:]:
              document = json.load(open(name, encoding="utf-8"))
              if name.endswith(".sarif"):
                  jsonschema.validate(document, schema)
              print("ok", name)
          PY

  # Keep the documented snippets equal to the examples the suite runs.
  docs:
    name: documented snippets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ci/check-docs.sh
