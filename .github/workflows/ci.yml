name: CI

on:
  push:
    branches: [main, layers]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # Debug catches safety faults; ReleaseSafe checks optimized code and timing on each host.
  # The fixtures expect the same answers in every mode; filtering just repeats a subset.
  # The full test target already builds and runs the examples.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        optimize: [Debug, ReleaseSafe]
        include:
          # One unchecked run catches optimizer-dependent behaviour; the other hosts have ReleaseSafe.
          - os: ubuntu-latest
            optimize: ReleaseFast
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Locate Zig package cache
        id: zig-cache-dir
        shell: bash
        run: |
          cache_dir=$(zig env | sed -n 's/^    \.global_cache_dir = "\(.*\)",$/\1/p' | sed 's,\\\\,/,g')
          test -n "$cache_dir"
          mkdir -p "$cache_dir/p"
          echo "path=$cache_dir/p" >> "$GITHUB_OUTPUT"
      - name: Cache Zig packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.zig-cache-dir.outputs.path }}
          key: zig-packages-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-packages-${{ runner.os }}-${{ env.ZIG_VERSION }}-
      - name: Fetch all Zig dependencies (three attempts)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if zig build --fetch=all; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Dependency fetch failed ($attempt/3); retrying after backoff"
            sleep "$((5 << (attempt - 1)))"
          done
      - name: Test — ${{ matrix.optimize }}
        run: zig build test -Doptimize=${{ matrix.optimize }}

  # ReleaseSmall must build; its unchecked tests add no distinct assertion to ReleaseFast.
  small:
    name: compile (ReleaseSmall)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Locate Zig package cache
        id: zig-cache-dir
        shell: bash
        run: |
          cache_dir=$(zig env | sed -n 's/^    \.global_cache_dir = "\(.*\)",$/\1/p' | sed 's,\\\\,/,g')
          test -n "$cache_dir"
          mkdir -p "$cache_dir/p"
          echo "path=$cache_dir/p" >> "$GITHUB_OUTPUT"
      - name: Cache Zig packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.zig-cache-dir.outputs.path }}
          key: zig-packages-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-packages-${{ runner.os }}-${{ env.ZIG_VERSION }}-
      - name: Fetch all Zig dependencies (three attempts)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if zig build --fetch=all; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Dependency fetch failed ($attempt/3); retrying after backoff"
            sleep "$((5 << (attempt - 1)))"
          done
      - run: zig build -Doptimize=ReleaseSmall

  # Formatting and source-policy checks read the same files on every host; once is enough.
  source:
    name: source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Locate Zig package cache
        id: zig-cache-dir
        shell: bash
        run: |
          cache_dir=$(zig env | sed -n 's/^    \.global_cache_dir = "\(.*\)",$/\1/p' | sed 's,\\\\,/,g')
          test -n "$cache_dir"
          mkdir -p "$cache_dir/p"
          echo "path=$cache_dir/p" >> "$GITHUB_OUTPUT"
      - name: Cache Zig packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.zig-cache-dir.outputs.path }}
          key: zig-packages-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-packages-${{ runner.os }}-${{ env.ZIG_VERSION }}-
      - name: Fetch all Zig dependencies (three attempts)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if zig build --fetch=all; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Dependency fetch failed ($attempt/3); retrying after backoff"
            sleep "$((5 << (attempt - 1)))"
          done
      - name: Formatting
        run: zig fmt --check build.zig build.zig.zon src examples ci
      - name: Casts out of the type system carry their reason
        run: python3 ci/casts.py
      - name: Source import boundaries
        run: zig build check-imports
      - name: Import gate regression checks
        run: python3 ci/test_imports.py

  # Compile the supported targets the native jobs cannot execute.
  cross-compile:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - x86_64-windows-gnu
          - x86_64-windows-msvc
          - aarch64-windows-gnu
          - x86_64-macos
          - aarch64-macos
          - x86_64-freebsd
          - x86_64-netbsd
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Locate Zig package cache
        id: zig-cache-dir
        shell: bash
        run: |
          cache_dir=$(zig env | sed -n 's/^    \.global_cache_dir = "\(.*\)",$/\1/p' | sed 's,\\\\,/,g')
          test -n "$cache_dir"
          mkdir -p "$cache_dir/p"
          echo "path=$cache_dir/p" >> "$GITHUB_OUTPUT"
      - name: Cache Zig packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.zig-cache-dir.outputs.path }}
          key: zig-packages-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-packages-${{ runner.os }}-${{ env.ZIG_VERSION }}-
      - name: Fetch all Zig dependencies (three attempts)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if zig build --fetch=all; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Dependency fetch failed ($attempt/3); retrying after backoff"
            sleep "$((5 << (attempt - 1)))"
          done
      - run: zig build -Dtarget=${{ matrix.target }}

  # Keep the documented snippets equal to the examples the suite runs.
  docs:
    name: documented snippets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ci/check-docs.sh
